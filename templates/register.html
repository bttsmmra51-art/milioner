<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - رحلة المليونير</title>
    <style>
        /* نفس الستايل من login.html */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at center, #2a1540 0%, #150820 60%, #0a0510 100%);
            display: grid; place-items: center; padding: 20px; color: #fff;
        }
        .auth-card {
            width: 100%; max-width: 420px;
            background: linear-gradient(145deg, #2a1540, #150820);
            border: 3px solid #4dff88; border-radius: 22px;
            padding: 32px 28px;
            box-shadow: 0 0 60px rgba(77,255,136,.3), 0 25px 70px rgba(0,0,0,.8);
        }
        .auth-title {
            text-align: center; color: #4dff88; font-size: 26px;
            font-weight: 900; margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(77,255,136,.5);
        }
        .auth-subtitle { text-align: center; color: #b9adca; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; color: #4dff88; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 13px 16px; border-radius: 12px;
            border: 2px solid rgba(77,255,136,.4);
            background: rgba(255,255,255,.06); color: #fff;
            font-size: 15px; font-family: inherit; outline: none;
        }
        .form-input:focus {
            border-color: #4dff88;
            box-shadow: 0 0 20px rgba(77,255,136,.4);
        }
        .form-btn {
            width: 100%; padding: 15px; margin-top: 8px;
            border-radius: 12px; border: none;
            background: linear-gradient(135deg, #4dff88, #1eaa55);
            color: #0d0919; font-size: 17px; font-weight: 900;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 4px 0 #0a5a28, 0 6px 12px rgba(0,0,0,.5);
        }
        .form-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .form-btn:disabled { opacity: .5; cursor: not-allowed; }
        .error-msg {
            background: rgba(255,77,77,.15); border: 1px solid #ff4d4d;
            color: #ff8080; padding: 10px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 700; margin-bottom: 14px;
            text-align: center; display: none;
        }
        .error-msg.show { display: block; }
        .switch-link { text-align: center; margin-top: 20px; color: #b9adca; font-size: 14px; }
        .switch-link a { color: #4dff88; text-decoration: none; font-weight: 900; }
    </style>
</head>
<body>

<div class="auth-card">
    <h1 class="auth-title">🎉 إنشاء حساب</h1>
    <p class="auth-subtitle">انضم لرحلة المليونير</p>

    <div id="error-msg" class="error-msg"></div>

    <form id="register-form">
        <div class="form-group">
            <label class="form-label">👤 اسم المستخدم</label>
            <input type="text" id="username" class="form-input" placeholder="3 أحرف على الأقل" required>
        </div>
        <div class="form-group">
            <label class="form-label">📧 البريد (اختياري)</label>
            <input type="email" id="email" class="form-input" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label class="form-label">🔒 كلمة السر</label>
            <input type="password" id="password" class="form-input" placeholder="6 أحرف على الأقل" required>
        </div>
        <div class="form-group">
            <label class="form-label">🔒 تأكيد كلمة السر</label>
            <input type="password" id="password2" class="form-input" placeholder="أعد كتابتها" required>
        </div>
        <button type="submit" class="form-btn" id="submit-btn">إنشاء الحساب</button>
    </form>

    <div class="switch-link">
        عندك حساب؟ <a href="/login">سجّل دخول</a>
    </div>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errBox = document.getElementById('error-msg');
    
    const pass1 = document.getElementById('password').value;
    const pass2 = document.getElementById('password2').value;
    
    if (pass1 !== pass2) {
        errBox.textContent = 'كلمتا السر غير متطابقتين';
        errBox.classList.add('show');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'جارٍ الإنشاء...';
    errBox.classList.remove('show');
    
    try {
        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: pass1
            })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = data.redirect || '/';
        } else {
            errBox.textContent = data.error || 'حدث خطأ';
            errBox.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'إنشاء الحساب';
        }
    } catch (err) {
        errBox.textContent = 'خطأ في الاتصال بالسيرفر';
        errBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'إنشاء الحساب';
    }
});
</script>
</body>
</html>
