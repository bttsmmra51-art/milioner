<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - رحلة المليونير</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at center, #2a1540 0%, #150820 60%, #0a0510 100%);
            display: grid; place-items: center; padding: 20px; color: #fff;
        }
        .auth-card {
            width: 100%; max-width: 420px;
            background: linear-gradient(145deg, #2a1540, #150820);
            border: 3px solid #E8B947; border-radius: 22px;
            padding: 32px 28px;
            box-shadow: 0 0 60px rgba(232,185,71,.3), 0 25px 70px rgba(0,0,0,.8);
        }
        .auth-title {
            text-align: center; color: #FFD84D; font-size: 28px;
            font-weight: 900; margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(255,216,77,.5);
        }
        .auth-subtitle { text-align: center; color: #b9adca; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block; color: #FFD84D; font-size: 13px;
            font-weight: 700; margin-bottom: 8px;
        }
        .form-input {
            width: 100%; padding: 14px 18px; border-radius: 12px;
            border: 2px solid rgba(232,185,71,.4);
            background: rgba(255,255,255,.06); color: #fff;
            font-size: 16px; font-family: inherit; outline: none;
            transition: all .2s;
        }
        .form-input:focus {
            border-color: #FFD84D;
            background: rgba(255,255,255,.1);
            box-shadow: 0 0 20px rgba(255,216,77,.4);
        }
        .form-btn {
            width: 100%; padding: 15px; margin-top: 8px;
            border-radius: 12px; border: none;
            background: linear-gradient(135deg, #ffd84d, #b88728);
            color: #1a0b2e; font-size: 17px; font-weight: 900;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 4px 0 #6a4a10, 0 6px 12px rgba(0,0,0,.5);
            transition: transform .15s;
        }
        .form-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .form-btn:active:not(:disabled) { transform: translateY(2px); }
        .form-btn:disabled { opacity: .5; cursor: not-allowed; }
        .error-msg {
            background: rgba(255,77,77,.15); border: 1px solid #ff4d4d;
            color: #ff8080; padding: 10px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 700; margin-bottom: 14px;
            text-align: center; display: none;
        }
        .error-msg.show { display: block; }
        .switch-link { text-align: center; margin-top: 20px; color: #b9adca; font-size: 14px; }
        .switch-link a { color: #FFD84D; text-decoration: none; font-weight: 900; }
        .switch-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">
    <h1 class="auth-title">🎮 تسجيل الدخول</h1>
    <p class="auth-subtitle">رحلة المليونير</p>

    <div id="error-msg" class="error-msg"></div>

    <form id="login-form">
        <div class="form-group">
            <label class="form-label">👤 اسم المستخدم أو الإيميل</label>
            <input type="text" id="username" class="form-input" placeholder="اكتب هنا..." required autocomplete="username">
        </div>
        <div class="form-group">
            <label class="form-label">🔒 كلمة السر</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="form-btn" id="submit-btn">دخول</button>
    </form>

    <div class="switch-link">
        ما عندك حساب؟ <a href="/register">أنشئ حساب جديد</a>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errBox = document.getElementById('error-msg');
    
    btn.disabled = true;
    btn.textContent = 'جارٍ الدخول...';
    errBox.classList.remove('show');
    
    try {
        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = data.redirect || '/';
        } else {
            errBox.textContent = data.error || 'حدث خطأ';
            errBox.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'دخول';
        }
    } catch (err) {
        errBox.textContent = 'خطأ في الاتصال بالسيرفر';
        errBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'دخول';
    }
});
</script>
</body>
</html>
